; PlatformIO Project Configuration File
;
; Target: ESP32 Dev Module (esp32dev)
; Framework: Arduino

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Options
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Upload Options
upload_speed = 115200

; Compiler options and include paths
build_flags =
    -I../protocol
    -Isrc
    -DCORE_DEBUG_LEVEL=3

; Libraries
lib_deps =
    ; WiFi and WiFiUDP are built into the Arduino ESP32 framework core
